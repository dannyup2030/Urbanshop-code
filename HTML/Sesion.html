<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Urban Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
  <header>
    <!-- Barra de navegación -->
    <nav class="bg-black text-white p-4 fixed w-full z-10 shadow-lg">
      <div class="container mx-auto flex justify-between items-center">
        <a href="inicio.html" class="text-2xl font-bold">Urban Shop</a>
        <!-- Botón hamburguesa -->
        <button id="menu-toggle" class="md:hidden text-white focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <!-- Menú grande -->
        <div id="menu" class="hidden md:flex space-x-4">
          <a href="inicio.html" class="hover:text-blue-300">Inicio</a>
          <a href="#" class="hover:text-blue-300">Productos</a>
          <a href="Sesion.html" class="hover:text-blue-300">Iniciar Sesión</a>
          <a href="registro.html" class="hover:text-blue-300 font-semibold underline">Registrarse</a>
          <a href="#" class="hover:text-blue-300">Carrito</a>
        </div>
      </div>

      <!-- Menú móvil -->
      <div id="mobile-menu" class="md:hidden hidden flex-col mt-2 space-y-2 px-4">
        <a href="inicio.html" class="block hover:text-blue-300">Inicio</a>
        <a href="#" class="block hover:text-blue-300">Productos</a>
        <a href="Sesion.html" class="block hover:text-blue-300">Iniciar Sesión</a>
        <a href="registro.html" class="block hover:text-blue-300 font-semibold underline">Registrarse</a>
        <a href="#" class="block hover:text-blue-300">Carrito</a>
      </div>
    </nav>
  </header>




  <!-- Login -->
  <main class="flex-grow flex items-center justify-center p-6 mt-24">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
      <h2 class="text-2xl font-semibold text-center mb-6 text-gray-800">Iniciar Sesión</h2>
      <form action="#" method="POST" class="space-y-4" id="loginForm">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input type="email" id="email" name="email" required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="password" name="password" required
            class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <!-- Roles -->
        <div class="mb-4">
          <label for="rol" class="block text-gray-700 font-bold mb-2">Selecciona tu rol:</label>
          <select id="rol" name="rol" class="w-full border rounded px-3 py-2">
            <option value="">-- Selecciona un rol --</option>
            <option value="cliente">Cliente</option>
            <option value="admin">Administrador</option>
            <option value="ventas">Personal de Ventas</option>
          </select>
        </div>
        <!-- Fin roles -->
        <button type="submit"
          class="w-full bg-black text-white py-2 rounded-md hover:bg-blue-700 transition duration-200">Ingresar</button>
        <div class="text-center mt-4">
          <a href="recuperar.html" class="text-blue-600 hover:underline text-sm">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="text-center mt-2">
          <a href="registro.html" class="text-blue-600 hover:underline text-sm">¿No tienes cuenta? Regístrate</a>
        </div>
      </form>
    </div>
  </main>
  <!-- Fin login -->

  <!-- Pie de página -->
  <footer class="bg-black text-center text-white p-4 mt-6">
    &copy; 2025 Urban Shop-Danny Urrea. Todos los derechos reservados.
  </footer>
  <script src="../JS/navegacion.js"></script>
</body>
<script src="../JS/sesion.js"></script>
</html>
