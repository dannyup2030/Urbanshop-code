<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Urban Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Barra de navegación -->

  <nav class="bg-black text-white p-4 fixed w-full z-10 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <a href="inicio.html" class="text-2xl font-bold">Urban Shop</a>

      <!-- Botón hamburguesa (solo visible en pantallas pequeñas) -->
      <button id="toggle-menu" class="md:hidden text-white focus:outline-none">
        <!-- Icono hamburguesa -->
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>


      <!-- Menú de escritorio -->
      <div id="nav-links" class="hidden md:flex space-x-4">
        <a href="inicio.html" class="hover:text-blue-300">Inicio</a>
        <a href="#" class="hover:text-blue-300">Productos</a>
        <a href="Sesion.html" class="hover:text-blue-300">Iniciar Sesión</a>
        <a href="registro.html" class="hover:text-blue-300 font-semibold underline">Registrarse</a>
        <a href="#" class="hover:text-blue-300">Carrito</a>
      </div>
    </div>


    <!-- Menú móvil -->
    <div id="mobile-menu"
      class="hidden flex-col space-y-2 bg-black text-white px-4 py-4 rounded-b-lg shadow-lg md:hidden">
      <a href="inicio.html" class="block hover:text-blue-300">Inicio</a>
      <a href="#" class="block hover:text-blue-300">Productos</a>
      <a href="Sesion.html" class="block hover:text-blue-300">Iniciar Sesión</a>
      <a href="registro.html" class="block hover:text-blue-300 font-semibold underline">Registrarse</a>
      <a href="#" class="block hover:text-blue-300">Carrito</a>
    </div>




  </nav>


  <!-- Imagen de fondo con capa oscura -->
  <section class="relative w-full h-[30rem] mt-16">
    <img src="../img/Logo Urban shop.png" alt="urbanShop" class="w-full h-full object-cover brightness-50" />
    <div class="absolute inset-0 flex items-center justify-center text-center px-4">
      <h1 class="text-2xl sm:text-3xl md:text-4xl text-white font-bold drop-shadow-lg uppercase">
        Bienvenido a Urban Shop
      </h1>
    </div>

  </section>

  <!-- Sección de categorías -->
  <section class="max-w-7xl mx-auto my-12 px-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Hombres -->
      <a href="hombres.html" class="group relative overflow-hidden rounded-xl shadow-lg">
        <img src="../img/Rey.png" alt="Hombres"
          class="w-full h-[400px] object-cover transform group-hover:scale-110 transition duration-500" />
        <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center">
          <h2 class="text-white text-2xl font-bold uppercase drop-shadow-md">Hombres</h2>
        </div>
      </a>

      <!-- Accesorios -->
      <a href="accesorios.html" class="group relative overflow-hidden rounded-xl shadow-lg">
        <img src="../img/accesorios.png" alt="Accesorios"
          class="w-full h-[400px] object-cover transform group-hover:scale-110 transition duration-500" />
        <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center">
          <h2 class="text-white text-2xl font-bold uppercase drop-shadow-md">Accesorios</h2>
        </div>
      </a>

      <!-- Mujeres -->
      <a href="mujeres.html" class="group relative overflow-hidden rounded-xl shadow-lg">
        <img src="../img/reyna.png" alt="Mujeres"
          class="w-full h-[400px] object-cover transform group-hover:scale-110 transition duration-500" />
        <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center">
          <h2 class="text-white text-2xl font-bold uppercase drop-shadow-md">Mujeres</h2>
        </div>
      </a>
    </div>
  </section>

  <!-- Carrusel de productos -->
  <section class="py-12 bg-white">
    <h2 class="text-3xl font-bold text-center mb-8 text-gray-800">Nuestros Productos</h2>

    <div class="relative max-w-7xl mx-auto">
      <button id="prev"
        class="absolute left-0 top-1/2 transform -translate-y-1/2 z-10 bg-black bg-opacity-50 hover:bg-opacity-80 text-white p-2 rounded-full">
        &#8592;
      </button>

      <!-- Contenedor dinámico donde se inyectarán los productos -->
      <div id="carousel" class="flex overflow-x-auto gap-6 px-10 scroll-smooth"></div>


      <button id="next"
        class="absolute right-0 top-1/2 transform -translate-y-1/2 z-10 bg-black bg-opacity-50 hover:bg-opacity-80 text-white p-2 rounded-full">
        &#8594;
      </button>
    </div>
  </section>

  <footer class="bg-black text-center text-white p-4">
    &copy; 2025 Urban Shop-Danny Urrea. Todos los derechos reservados.
  </footer>

</body>
<script src="../assets/JS/index.js"></script>

</html>
