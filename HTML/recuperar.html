<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar Contraseña - Urban Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <header>
    <!-- Barra de navegación -->
    <nav class="bg-black text-white fixed w-full z-10 shadow-lg">
      <div class="container mx-auto flex justify-between items-center p-4">
        <a href="inicio.html" class="text-2xl font-bold">Urban Shop</a>

        <!-- Botón hamburguesa visible en pantallas pequeñas -->
        <button id="menu-btn" class="block md:hidden focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <!-- Menú (oculto en móviles) -->
        <div
          id="menu"
          class="hidden md:flex space-x-6 text-lg items-center"
        >
          <a href="inicio.html" class="hover:text-blue-300">Inicio</a>
          <a href="Sesion.html" class="hover:text-blue-300">Iniciar Sesión</a>
          <a href="registro.html" class="hover:text-blue-300">Registrarse</a>
          <a href="#" class="hover:text-blue-300">Productos</a>
          <a href="#" class="hover:text-blue-300">Carrito</a>
        </div>
      </div>

      <!-- Menú desplegable vertical para móviles -->
      <div id="menu-mobile" class="hidden bg-black px-4 pb-4 md:hidden">
        <a href="inicio.html" class="block py-2 hover:text-blue-300">Inicio</a>
        <a href="Sesion.html" class="block py-2 hover:text-blue-300">Iniciar Sesión</a>
        <a href="registro.html" class="block py-2 hover:text-blue-300">Registrarse</a>
        <a href="#" class="block py-2 hover:text-blue-300">Productos</a>
        <a href="#" class="block py-2 hover:text-blue-300">Carrito</a>
      </div>
    </nav>
  </header>

  <main class="flex-grow flex items-center justify-center p-6 mt-20">
    <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Recuperar Contraseña</h1>

      <!-- Paso 1: Ingresar email -->
      <form id="emailForm" class="space-y-4">
        <label for="email" class="block font-semibold text-gray-700">Correo Electrónico</label>
        <input type="email" id="email" name="email" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />
        <button type="submit"
          class="w-full bg-black text-white py-2 rounded-md hover:bg-blue-800 transition">Enviar Código</button>
      </form>

      <!-- Paso 2: Validar código y cambiar contraseña (oculto al inicio) -->
      <form id="resetForm" class="space-y-4 mt-6 hidden">
        <label for="code" class="block font-semibold text-gray-700">Código de Verificación</label>
        <input type="text" id="code" name="code" required maxlength="6"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />

        <label for="newPassword" class="block font-semibold text-gray-700">Nueva Contraseña</label>
        <input type="password" id="newPassword" name="newPassword" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />

        <label for="confirmPassword" class="block font-semibold text-gray-700">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />

        <button type="submit"
          class="w-full bg-black text-white py-2 rounded-md hover:bg-blue-800 transition">Cambiar Contraseña</button>
      </form>
    </div>
  </main>

  <footer class="bg-black text-center text-white p-4">
    &copy; 2025 Urban Shop-Danny Urrea. Todos los derechos reservados.
  </footer>

 
   

  
<script src="../JS/recuperar.js"></script>
</body>

</html>
