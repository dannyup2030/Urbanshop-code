<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar Contraseña - Urban Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <nav class="bg-black text-white p-4 fixed w-full top-0 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <a href="inicio.html" class="text-2xl font-bold">Urban Shop</a>
      <div class="space-x-4">
        <a href="inicio.html" class="hover:text-blue-300">Inicio</a>
        <a href="Sesion.html" class="hover:text-blue-300">Iniciar Sesión</a>
        <a href="registro.html" class="hover:text-blue-300">Registrarse</a>
      </div>
    </div>
  </nav>

  <main class="bg-white rounded-lg shadow-md p-8 w-full max-w-md mt-20">
    <h1 class="text-2xl font-bold mb-6 text-center">Recuperar Contraseña</h1>

    <!-- Paso 1: Ingresar email -->
    <form id="emailForm" class="space-y-4">
      <label for="email" class="block font-semibold">Correo Electrónico</label>
      <input type="email" id="email" name="email" required
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />
      <button type="submit"
        class="w-full bg-black text-white py-2 rounded-md hover:bg-gray-800 transition">Enviar Código</button>
    </form>

    <!-- Paso 2: Validar código y cambiar contraseña (oculto al inicio) -->
    <form id="resetForm" class="space-y-4 mt-6 hidden">
      <label for="code" class="block font-semibold">Código de Verificación</label>
      <input type="text" id="code" name="code" required maxlength="6"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <label for="newPassword" class="block font-semibold">Nueva Contraseña</label>
      <input type="password" id="newPassword" name="newPassword" required
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <label for="confirmPassword" class="block font-semibold">Confirmar Contraseña</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <button type="submit"
        class="w-full bg-black text-white py-2 rounded-md hover:bg-gray-800 transition">Cambiar Contraseña</button>
    </form>

  </main>

  <!-- Enlace al archivo JS separado -->
  <script src="recuperar.js"></script>

</body>

</html>
